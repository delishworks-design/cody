plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The embedded Termux backend requires the applicationId to be "com.termux", because the
// bootstrap binaries and shared libraries that Termux ships have the path
// /data/data/com.termux/files/usr hard-coded into them. The user-facing app name is "Cody"; only
// the package identifier stays "com.termux". See README.md for details.
def termuxPackageName = "com.termux"

android {
    namespace 'com.termux.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId termuxPackageName
        minSdk 24
        // Termux must target API 28: on Android 10+ (API 29+) an app may not exec() files from its
        // own writable data directory. The embedded Termux rootfs lives there, so targeting 28 keeps
        // `bash`, `apt`, `proot` and `opencode` runnable. This matches the upstream Termux app.
        targetSdk 28
        versionCode 1
        versionName "1.0.0"

        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
        }
    }

    flavorDimensions "default"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // The libtermux-bootstrap.so shared library (which embeds the Termux rootfs zip) is built by
    // the buildBootstrapLibs task below and packaged from this directory.
    sourceSets {
        main {
            jniLibs.srcDirs += [file("$buildDir/bootstrap/libs")]
            assets.srcDirs += [file("$buildDir/generated/assets")]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':terminal-emulator')
    implementation project(':terminal-view')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'androidx.core:core:1.6.0'
}

// ---------------------------------------------------------------------------------------------
// Termux bootstrap embedding
// ---------------------------------------------------------------------------------------------

def bootstrapMapping = ['aarch64': 'arm64-v8a', 'x86_64': 'x86_64']
def bootstrapCacheDir = rootProject.file('.cache/bootstraps')
def cppDir = file('src/main/cpp')
def genBootstrapDir = layout.buildDirectory.dir('bootstrap').get().asFile

tasks.register('downloadBootstraps') {
    description = 'Copies the Termux rootfs bootstrap archives into the native build directory.'
    def jniDir = new File(genBootstrapDir, 'jni')
    outputs.dir(jniDir)
    inputs.dir(bootstrapCacheDir)
    doLast {
        jniDir.mkdirs()
        bootstrapMapping.keySet().each { arch ->
            def src = new File(bootstrapCacheDir, "bootstrap-${arch}.zip")
            if (!src.exists()) {
                throw new GradleException("Missing bootstrap archive: ${src}. " +
                        "Run scripts/fetch-bootstraps.ps1 or place it in .cache/bootstraps/.")
            }
            if (src.length() < 1_000_000L) {
                throw new GradleException("Bootstrap archive is suspiciously small (${src.length()} bytes): ${src}. " +
                        "It is likely a stale/failed download. Delete it and re-run scripts/fetch-bootstraps.ps1.")
            }
            try {
                new java.util.zip.ZipFile(src).close()
            } catch (java.io.IOException e) {
                throw new GradleException("Bootstrap archive is not a valid zip: ${src}.", e)
            }
            copy { from src; into jniDir }
        }
        copy { from new File(cppDir, 'Android.mk'); into jniDir }
        copy { from new File(cppDir, 'termux-bootstrap.c'); into jniDir }
        copy { from new File(cppDir, 'termux-bootstrap-zip.S'); into jniDir }
    }
}

tasks.register('buildBootstrapLibs') {
    description = 'Cross-compiles libtermux-bootstrap.so (embedded Termux rootfs) for each ABI.'
    dependsOn 'downloadBootstraps'
    def libsDir = new File(genBootstrapDir, 'libs')
    def jniDir = new File(genBootstrapDir, 'jni')
    inputs.dir(jniDir)
    outputs.dir(libsDir)
    doLast {
        def ndk = android.ndkDirectory
        def ndkBuild = new File(ndk, 'ndk-build.cmd')
        if (!ndkBuild.exists()) ndkBuild = new File(ndk, 'ndk-build')
        if (!ndkBuild.exists()) throw new GradleException("ndk-build not found under ${ndk}")

        // ndk-build does not support spaces in paths, and this project can live under a path with
        // spaces. Compile in a space-free temporary directory and copy the result back.
        def workRoot = new File(System.getProperty('java.io.tmpdir'), 'opencode-bootstrap-build')
        delete(workRoot)
        def workJni = new File(workRoot, 'jni')
        workJni.mkdirs()
        copy { from jniDir; into workJni }

        def outDir = new File(workRoot, 'obj')
        def tmpLibs = new File(workRoot, 'libs')
        tmpLibs.mkdirs()

        def args = [ndkBuild.absolutePath,
                    "NDK_PROJECT_PATH=${workRoot.absolutePath}".toString(),
                    "NDK_OUT=${outDir.absolutePath}".toString(),
                    "NDK_LIBS_OUT=${tmpLibs.absolutePath}".toString(),
                    "APP_ABI=arm64-v8a x86_64",
                    "APP_PLATFORM=android-24"]
        logger.lifecycle("Running ndk-build in ${workRoot}")
        def proc = args.execute(null, workJni)
        proc.consumeProcessOutputStream(System.out)
        proc.consumeProcessErrorStream(System.err)
        def code = proc.waitFor()
        if (code != 0) throw new GradleException("ndk-build failed with exit code ${code}")

        copy {
            from tmpLibs
            into libsDir
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
        logger.lifecycle("Copied native libs: " + fileTree(libsDir).files.collect { it.name })
    }
}

// Make sure the embedded bootstrap library is built and packaged before the APK is assembled.
tasks.configureEach { t ->
    if (t.name == 'preBuild' || (t.name.startsWith('merge') && t.name.contains('JniLibFolders'))) {
        t.dependsOn 'buildBootstrapLibs'
    }
}
