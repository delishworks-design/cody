org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
# Run the Kotlin compiler inside the Gradle daemon instead of spawning a separate Kotlin daemon.
# On Windows (especially with OneDrive/AV scanning the project) the detached Kotlin daemon keeps
# handles on build/kotlin/.../caches-jvm open, which makes the next build fail to clean its own
# working directory with "Unable to delete directory".
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
kotlin.code.style=official
