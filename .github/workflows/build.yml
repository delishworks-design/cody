name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # The project's own toolchain (aapt2, ndk-build, the bundled make) ships as x86_64 binaries,
    # so the build only runs natively on an x86_64 runner. An arm64 host needs binfmt_misc + qemu,
    # which is not something a build should depend on.
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "platform-tools"

      # The repo has no gradlew checked in (only gradle-wrapper.properties), so Gradle is
      # installed at the version the wrapper pins.
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle and NDK downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The Termux rootfs archives are embedded into the APK as libtermux-bootstrap.so and are
      # git-ignored, so a fresh checkout cannot build without them. Pinned to the same release the
      # PowerShell helper uses.
      - name: Fetch Termux bootstrap archives
        run: |
          mkdir -p .cache/bootstraps
          RELEASE=bootstrap-2026.10.04-r1+apt.android-7
          for arch in aarch64 x86_64; do
            curl -fsSL --retry 3 -H "User-Agent: opencode-android-build" \
              -o ".cache/bootstraps/bootstrap-${arch}.zip" \
              "https://github.com/termux/termux-packages/releases/download/${RELEASE}/bootstrap-${arch}.zip"
            ls -la ".cache/bootstraps/bootstrap-${arch}.zip"
          done

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # assembleRelease emits an unsigned APK. It is signed here rather than in build.gradle so no
      # keystore material and no signing config ever enter the repository.
      - name: Sign the release APK
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          keytool -genkeypair -v -keystore release.jks -storepass cody -keypass cody \
            -alias cody -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Cody, OU=Cody, O=delishworks-design, L=, S=, C=PH"

          mkdir -p signed
          i=0
          for apk in app/build/outputs/apk/release/*.apk; do
            i=$((i+1))
            aligned="signed/aligned-${i}.apk"
            "${BT}/zipalign" -f -p 4 "$apk" "$aligned"
            "${BT}/apksigner" sign \
              --ks release.jks --ks-pass pass:cody --key-pass pass:cody \
              --out "signed/cody-$(date -u +%Y%m%d)-${i}.apk" "$aligned"
            "${BT}/apksigner" verify --print-certs "signed/cody-$(date -u +%Y%m%d)-${i}.apk" | head -3
          done
          ls -la signed/

      - uses: actions/upload-artifact@v4
        with:
          name: cody-release-apk
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build"
            echo ""
            echo "commit \`${GITHUB_SHA:0:8}\` — ${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la signed/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no signed APK" >> "$GITHUB_STEP_SUMMARY"
